<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Data Plot</title>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-3.5.0.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="graphene-rpc.js"></script>
    <link rel="stylesheet" href="main.css">
    <style>
    #loading {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 150px;
        opacity: 0.9;
        display: none;
        z-index: 2;
    }
    #progressBar {
        height: 8px;
        background-color: #333;
        border-radius: 4px;
        overflow: hidden;
    }
    #progressBarFill {
        height: 100%;
        background-color: #d8bc27;
        width: 0%;
        transition: width 0.3s ease;
    }
    #progressText {
        color: #d8bc27;
        font-size: 12px;
        margin-top: 4px;
        text-align: center;
    }

    body {
        background-color: #0d1117dd;
        color: #d8bc27;
    }

    .plotFooter {
        transform: scaleY(0.1);
        background-color:#d8bc27dd;
        bottom:-50px;
        position:fixed;
        z-index:2;
        width:100%;
        transition: transform 0.5s ease, bottom 0.5s ease, background-color 0.5s ease;
    }
    .plotFooter:hover {
        background-color:#000000bb;
        transition: transform 0.5s ease, bottom 0.5s ease, background-color 0.5s ease;
        bottom:0px;
        transform: scaleY(1);
    }
    #plotlyDiv {
        width: 80vw;
        height: 80vh;
        border:1px solid white;
        border-radius:5px;
        margin:auto;
    }
    #searchTools {
        background-color:#000000ee;
        z-index:1;
        position:absolute;
        height:auto;
        overflow:hidden;
        transform: rotateX(180deg);
        transform-origin: center -100px;
        transition: transform 0.7s ease-out;
        border:2px solid gold;
        border-radius:8px;
        padding:12px;
        box-shadow: 0 0 15px rgba(216, 188, 39, 0.4);
    }
    #searchTools.closed {
        pointer-events: none;
    }
    #fold {
        z-index:2;
        border:2px solid gold;
        border-radius:8px;
        background-color:#000000ee;
        width:40px;
        height:40px;
        font-size:20px;
        color:#d8bc27;
        margin:15px;
        box-shadow: 0 0 10px rgba(216, 188, 39, 0.5);
    }
    table{
        border:1px solid white;
        border-radius:5px;
        max-height:300px;
        overflow:scroll;
    }
    input, button {
        background-color:#222222dd;
        color: #d8bc27;
        border:1px solid gold;
        border-radius:5px;
        transition: background-color 0.2s, border-color 0.2s;
    }
    button:hover {
        background-color:#333333ee;
        border-color: #fff;
    }
    button:active {
        background-color:#d8bc27;
        color: #000;
    }
    </style>
</head>

<body class="main">
    <div id="loading">
        <div id="progressBar"><div id="progressBarFill"></div></div>
        <div id="progressText"></div>
    </div>
    <button id="fold" onclick="searchToggle(this)">⚙</button>
    <div id="searchTools" class="closed" tabindex="0" style="z-index:2;">
<div id="overlay"></div>
        <input type="search" id="tokenSearch" name="tokenSearch" placeholder="Token Search" onkeydown="if (event.keyCode == 13) {document.getElementById('searchButton').click()}" />
        <input type="number" id="daysAgoBox" name="daysAgoBox" placeholder="Number of days past"/>
        <button id="searchButton" onclick='dispSearch()'>Search</button>
        <button onclick='searchToggle(document.getElementById("fold"));plot_feed(2)'>Plot</button>
        <br>
        <table id="searchResults" style="display:inline-block">
        </table>
        <table id="selectedTokens" style="display:inline-block">
        </table>
    </div>
    <div id="plotlyDiv"></div>
    
</body>
<script src="feed_graph.js"></script>
<script>
function searchToggle(self) {
    let tools = document.getElementById("searchTools");
    if (self.innerHTML == "✕") {
        tools.style.transform = "rotateX(180deg)";
        tools.classList.add("closed");
        self.innerHTML = "⚙";
    } else {
        tools.style.transform = "rotateX(0deg)";
        tools.classList.remove("closed");
        self.innerHTML = "✕";
    }
}

// Close search tools when clicking outside the tools panel or toggle button
document.addEventListener('click', function(event) {
    const tools = document.getElementById('searchTools');
    const toggle = document.getElementById('fold');
    const isOpen = toggle.innerHTML == "✕";
    const hasFocus = tools.contains(document.activeElement) || tools === document.activeElement;

    // If click is on toggle or inside searchTools (has focus), don't close
    if (toggle.contains(event.target) || hasFocus) return;

    // Close if open
    if (isOpen) {
        tools.style.transform = "rotateX(180deg)";
        tools.classList.add("closed");
        toggle.innerHTML = "⚙";
    }
});
</script>

</html>
