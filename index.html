<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Data Plot</title>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="main.css">
    <style>
    #loading {
        position: fixed;
        width: 50px;
        top: 10px;
        right: 10px;
/*        transform: translate(-50%, -50%);*/
        opacity: 0.7;
        border: solid #ae9929f4 5px;
        border-radius: 5px;
        display: none;
        z-index: 2;
    }

    body {
        background-color: #0d1117dd;
        color: #d8bc27;
    }

    .plotFooter {
        transform: scaleY(0.1);
        background-color:#d8bc27dd;
        bottom:-50px;
        position:fixed;
        z-index:2;
        width:100%;
        transition: transform 0.5s ease, bottom 0.5s ease, background-color 0.5s ease;
    }
    .plotFooter:hover {
        background-color:#000000bb;
        transition: transform 0.5s ease, bottom 0.5s ease, background-color 0.5s ease;
        bottom:0px;
        transform: scaleY(1);
    }
    #plotlyDiv {
        width: 80vw;
        height: 80vh;
        border:1px solid white;
        border-radius:5px;
        margin:auto;
    }
    #searchTools {
        background-color:#000000dd;
        z-index:1;
        position:absolute;
        height:auto;
        overflow:hidden;
        pointer-events: none;
        transform: rotateX(180deg);
        transform-origin: center -100px;
        transition: transform 0.7s ease-out;
        border:1px solid gold;
        border-radius:5px;
        padding:10px;
    }
    #fold {
        z-index:2;
        border:1px solid gold;
        border-radius:5px;
        background-color:#000000dd;
        width:25px;
        height:25px;
        color:#d8bc27
    }
    table{
        border:1px solid white;
        border-radius:5px;
        max-height:300px;
        overflow:scroll;
    }
    input, button {
        background-color:#222222dd;
        color: #d8bc27;
        border:1px solid gold;
        border-radius:5px;
    }
    </style>
</head>

<body class="main">
    <img id="loading" src="loading.gif"></img>
    <button id="fold" onclick="searchToggle(this)">🞁</button>
    <div id="searchTools">
        <input type="search" id="tokenSearch" name="tokenSearch" placeholder="Token Search" onkeydown="if (event.keyCode == 13) {document.getElementById('searchButton').click()}" />
        <input type="number" id="daysAgoBox" name="daysAgoBox" placeholder="Number of days past"/>
        <button id="searchButton" onclick='dispSearch()'>Search</button>
        <button onclick='searchToggle(document.getElementById("fold"));plot_feed(2)'>Plot</button>
        <br>
        <table id="searchResults" style="display:inline-block">
        </table>
        <table id="selectedTokens" style="display:inline-block">
        </table>
    </div>
    <div id="plotlyDiv"></div>
    <footer class="plotFooter">
        <hr>
        <p>Website created by <a href="https://www.github.com/squidKid-deluxe">squidKid-deluxe</a>, imagined by <a href="https://www.github.com/litepresence">litepresence</a></p>
    </footer>
</body>
<script src="feed_graph.js"></script>
<script>
function searchToggle(self) {
    let tools = document.getElementById("searchTools")
    if (self.innerHTML == "🞃") {
        tools.style.transform = "rotateX(180deg)";
        tools.style.pointerEvents = "none";
        self.innerHTML = "🞁";
    } else {
        tools.style.transform = "rotateX(0deg)";
        tools.style.pointerEvents = "auto";
        self.innerHTML = "🞃";
    }
}
</script>

</html>
