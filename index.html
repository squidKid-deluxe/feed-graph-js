<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Data Plot</title>
    <script src="https://cdn.plot.ly/plotly-3.5.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="graphene-rpc.js"></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="loading">
        <div id="progressBar"><div id="progressBarFill"></div></div>
        <div id="progressText"></div>
    </div>
    <div class="layout">
        <div id="searchTools">
            <div class="searchRow">
                <input type="search" id="tokenSearch" placeholder="Token Search" onkeydown="if(event.keyCode==13)document.getElementById('searchButton').click()">
                <button id="searchButton" onclick="dispSearch()">🔍</button>
            </div>
            <table id="searchResults"></table>
            <hr>
            <table id="selectedTokens"></table>
            <hr>
            <input type="number" id="daysAgoBox" placeholder="Days ago" value="7" title="Number of days of history to fetch">
            <button class="plotButton" onclick="plot_feed()">Plot</button>
        </div>
        <div id="plotlyDiv"></div>
    </div>
    <script src="feed_graph.js"></script>
</body>
</html>
